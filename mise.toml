# Every tool the kit installs, on every machine, from one file.
#
# WHY THIS IS ONE FILE AND NOT TWO PACKAGE MANAGERS (measured 2026-08-30):
#   Homebrew on the Mac + apt on Ubuntu/WSL means two lists, two names per tool, two
#   failure modes, forever. mise removes the question: the `aqua:` backend installs a
#   pinned binary from the project's own GitHub release, picking the right one per
#   platform at install time. Same file, same versions, macOS and Linux and WSL.
#
# WHY `aqua:` AND NOT `ubi:` OR `github:` — all three were tried here:
#   ubi:     DEPRECATED. mise says so on use: "Use the github backend instead …
#            This will be removed in mise 2027.1.0." Do not build on it.
#   github:  extracts the whole archive (so age-keygen comes along, which ubi dropped —
#            and `piy add` needs it), but exposes whatever the asset is NAMED. sops
#            ships a bare `sops-v3.13.3.linux.amd64`, so no `sops` command appears.
#   aqua:    the curated registry knows each project's naming, so the commands land as
#            `sops`, `age`, `age-keygen`. It also verifies SLSA provenance
#            on the way in, which no package manager here was doing before.
#
# NOT IN THIS FILE, and each for a stated reason:
#   claude    — its own installer, self-updates on launch. Never a package manager.
#   mise      — bootstraps itself (https://mise.run). It is the thing reading this file.
#   iTerm2    — a Mac GUI app, and OPTIONAL: Ctrl+J makes a new line in every terminal
#               including Apple's. If it is ever wanted, iterm2.com/downloads/stable/latest
#               302s straight to a versioned .zip — still no Homebrew.

# PINNED, NOT "latest". An unpinned kit means two people who run it a month apart get
# different binaries, which is the opposite of the reason it exists — and it makes every
# upgrade an invisible change rather than a reviewable diff. mise.lock records aqua's
# checksum for each resolved version and is committed beside this file.
# To move one: edit the version, run `mise install`, commit both files together.

[tools]
"aqua:twpayne/chezmoi"     = "2.72.0"   # applies this repo to their home directory
"aqua:getsops/sops"        = "3.13.3"   # the store's encryption
"aqua:FiloSottile/age"     = "1.3.1"    # …and its key. Brings age-keygen
# The folder server for ~/piy-work on :29200 — the pages the agent writes for them, README
# rendered at every folder. Back as of 2026-09-17 (it left with the v2 dashboard): a generic
# file server over a folder is work.l for one person, and reading what the agent writes is
# a frequent need. Started by ~/.piy-shell.sh, loopback only, symlinks off.
"aqua:svenstaro/miniserve" = "0.35.0"
# jq merges ~/.claude/settings.json rather than replacing it. NOT python3: a stock Mac has
# none without Command Line Tools, which v2 deliberately stopped installing.
"aqua:jqlang/jq"           = "1.8.2"
# gh, because /piy-save pushes their work and /piy-bug files a report — both were written
# assuming it, and nothing installed it. A project they cannot push is not saved.
"aqua:cli/cli"             = "2.98.0"

[settings]
lockfile = true
